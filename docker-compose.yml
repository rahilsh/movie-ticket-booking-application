services:
  postgres:
    image: postgres:16-alpine
    container_name: mtba-postgres
    environment:
      POSTGRES_DB: mtba_dev
      POSTGRES_USER: mtba
      POSTGRES_PASSWORD: mtba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtba -d mtba_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mtba-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/mtba_dev
      DB_USERNAME: mtba
      DB_PASSWORD: mtba
      JWT_SECRET: change-me-in-production-must-be-at-least-256-bits-long!!
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
