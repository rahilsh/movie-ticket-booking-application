spring:
  datasource:
    url: jdbc:h2:mem:mtba_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false   # Flyway disabled for tests; Hibernate creates schema via ddl-auto

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256-testing
    expiration-ms: 3600000

logging:
  level:
    in.rsh.mtba: DEBUG
    org.springframework.security: WARN
