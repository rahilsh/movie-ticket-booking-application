spring:
  datasource:
    url: jdbc:h2:mem:mtba_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=value
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256-testing
    expiration-ms: 3600000
  booking:
    expiry-enabled: false

logging:
  level:
    com.rsh.mtba: DEBUG
    org.springframework.security: WARN
    org.springframework.jdbc.core: DEBUG
