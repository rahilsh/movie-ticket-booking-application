spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mtba_dev}
    username: ${DB_USERNAME:mtba}
    password: ${DB_PASSWORD:mtba}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-must-be-at-least-256-bits-long}

logging:
  level:
    com.rsh.mtba: DEBUG
    org.springframework.security: DEBUG
    org.springframework.jdbc.core: DEBUG
